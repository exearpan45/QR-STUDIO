<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  
  <!-- Base background squircle -->
  <rect width="512" height="512" rx="128" fill="#0F172A" />
  
  <!-- Outer Finder Pattern (Top-Left) -->
  <rect x="80" y="80" width="130" height="130" rx="28" stroke="url(#qrGrad)" stroke-width="24" fill="none" />
  <rect x="122" y="122" width="46" height="46" rx="14" fill="url(#qrGrad)" />

  <!-- Outer Finder Pattern (Top-Right) -->
  <rect x="302" y="80" width="130" height="130" rx="28" stroke="url(#qrGrad)" stroke-width="24" fill="none" />
  <rect x="344" y="122" width="46" height="46" rx="14" fill="url(#qrGrad)" />

  <!-- Outer Finder Pattern (Bottom-Left) -->
  <rect x="80" y="302" width="130" height="130" rx="28" stroke="url(#qrGrad)" stroke-width="24" fill="none" />
  <rect x="122" y="344" width="46" height="46" rx="14" fill="url(#qrGrad)" />

  <!-- Center Decorative Studio Matrix Elements -->
  <rect x="238" y="96" width="36" height="36" rx="10" fill="#E2E8F0" />
  <rect x="238" y="152" width="36" height="36" rx="10" fill="url(#accentGrad)" />
  <rect x="96" y="238" width="36" height="36" rx="10" fill="#E2E8F0" />
  <rect x="152" y="238" width="36" height="36" rx="10" fill="#94A3B8" />

  <!-- Central Star / Studio Emblem -->
  <circle cx="256" cy="256" r="32" fill="url(#qrGrad)" />
  <circle cx="340" cy="256" r="18" fill="url(#accentGrad)" />
  <rect x="290" y="302" width="48" height="48" rx="14" fill="#E2E8F0" />
  <rect x="366" y="302" width="66" height="36" rx="12" fill="url(#qrGrad)" />
  <rect x="290" y="378" width="66" height="54" rx="16" fill="url(#accentGrad)" />
  <rect x="384" y="366" width="48" height="66" rx="16" fill="#F8FAFC" />
</svg>
